# Checks of Pipesmith Registry on every push to main and every pull request:
# gofmt, go vet and the tests with the race detector, then the build of the
# three platforms, all in the Go image that tools/go.sh pins.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check and build
        run: |
          export DOCKER_CONFIG="$RUNNER_TEMP/docker"
          mkdir -p "$DOCKER_CONFIG"
          tools/go.sh check
          tools/go.sh build
