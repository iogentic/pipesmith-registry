<svg xmlns="http://www.w3.org/2000/svg" id="psr-flow-export" viewBox="0 0 1360 752" width="1360" height="752" role="img" aria-label="Folder Export, Pipesmith Registry 0.2.0. An export counts from the index first, then streams the files of the blob stores and writes nothing. 1: Browser to Server: GET ?path=&lt;folder&gt;&amp;dry=1. 2: Server to index.sqlite: list the folder, count files and bytes. 3: Server: at most 20,000 files and 2 GiB; entry names checked. 4: Server to Browser: 200 form, name, files, bytes; 413 over a limit. 5: Browser to Server: dry=1 again, then the download. 6: Server: two exports at a time, one per account, else 429. 7: Server to Blob stores: each file as a download reads it. 8: Server to Browser: 200 zip or tar, streamed. 9: Server: ends after 60 s unread or 2 hours; writes one log line."><title>Pipesmith Registry folder export</title><style>#psr-flow-export{--psr-bg:#F5F7FC; --psr-panel:#FFFFFF; --psr-dim:#EEF2FA; --psr-ink:#0A1020; --psr-muted:#46526E; --psr-line:#D8DEEA; --psr-edge:#7A859C; --psr-req:#2B62F0; --psr-read:#12B5D6; --psr-write:#7A52F0;}@media (prefers-color-scheme: dark){#psr-flow-export{--psr-bg:#05070D; --psr-panel:#0D1322; --psr-dim:#151D31; --psr-ink:#F2F6FF; --psr-muted:#A6B3CF; --psr-line:#1F2A42; --psr-edge:#5B6A8C; --psr-req:#3D7BFF; --psr-read:#22E6FF; --psr-write:#8A5CFF;}}[data-theme="light"] #psr-flow-export{--psr-bg:#F5F7FC; --psr-panel:#FFFFFF; --psr-dim:#EEF2FA; --psr-ink:#0A1020; --psr-muted:#46526E; --psr-line:#D8DEEA; --psr-edge:#7A859C; --psr-req:#2B62F0; --psr-read:#12B5D6; --psr-write:#7A52F0;}[data-theme="dark"] #psr-flow-export{--psr-bg:#05070D; --psr-panel:#0D1322; --psr-dim:#151D31; --psr-ink:#F2F6FF; --psr-muted:#A6B3CF; --psr-line:#1F2A42; --psr-edge:#5B6A8C; --psr-req:#3D7BFF; --psr-read:#22E6FF; --psr-write:#8A5CFF;}#psr-flow-export text{font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}#psr-flow-export .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}</style><defs><marker id="psr-flow-export-req" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--psr-req, #3D7BFF)" stroke="none"/></marker><marker id="psr-flow-export-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--psr-muted, #A6B3CF)" stroke="none"/></marker><marker id="psr-flow-export-read" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--psr-read, #22E6FF)" stroke="none"/></marker><marker id="psr-flow-export-write" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--psr-write, #8A5CFF)" stroke="none"/></marker></defs>
