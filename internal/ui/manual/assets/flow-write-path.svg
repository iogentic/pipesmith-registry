<svg xmlns="http://www.w3.org/2000/svg" id="psr-flow-write-path" viewBox="0 0 1360 992" width="1360" height="992" role="img" aria-label="Write Path, Pipesmith Registry 0.2.0. A write is in the store and the index before the answer; a delete marks the blob and removes no file. 1: Client to Server: PUT /repository/&lt;hosted&gt;/&lt;path&gt;. 2: Server: origin, credentials, permission, policy, size, free space. 3: Server to content/tmp: stream the body: MD5, SHA-1, SHA-256, SHA-512. 4: Server: size and digest checked; path lock; index lock within 10 s. 5: content/tmp to content/&lt;minute&gt;: rename the bytes, write &lt;id&gt;.properties. 6: Server to reconciliation: one line: time, &lt;id&gt;, true. 7: Server to index.sqlite: row in files_&lt;store&gt;, same transaction. 8: Server to Client: 201; the file is served at once. Delete. 9: Client to Server: DELETE /repository/&lt;hosted&gt;/&lt;path&gt;. 10: Server to index.sqlite: no row: 404; row in a store of the existing install: 409. 11: Server to content/&lt;minute&gt;: deleted=true, deletedReason, deletedDateTime. 12: Server to index.sqlite: row dropped; no file removed. 13: Server to Client: 204."><title>Pipesmith Registry write path</title><style>#psr-flow-write-path{--psr-bg:#F5F7FC; --psr-panel:#FFFFFF; --psr-dim:#EEF2FA; --psr-ink:#0A1020; --psr-muted:#46526E; --psr-line:#D8DEEA; --psr-edge:#7A859C; --psr-req:#2B62F0; --psr-read:#12B5D6; --psr-write:#7A52F0;}@media (prefers-color-scheme: dark){#psr-flow-write-path{--psr-bg:#05070D; --psr-panel:#0D1322; --psr-dim:#151D31; --psr-ink:#F2F6FF; --psr-muted:#A6B3CF; --psr-line:#1F2A42; --psr-edge:#5B6A8C; --psr-req:#3D7BFF; --psr-read:#22E6FF; --psr-write:#8A5CFF;}}[data-theme="light"] #psr-flow-write-path{--psr-bg:#F5F7FC; --psr-panel:#FFFFFF; --psr-dim:#EEF2FA; --psr-ink:#0A1020; --psr-muted:#46526E; --psr-line:#D8DEEA; --psr-edge:#7A859C; --psr-req:#2B62F0; --psr-read:#12B5D6; --psr-write:#7A52F0;}[data-theme="dark"] #psr-flow-write-path{--psr-bg:#05070D; --psr-panel:#0D1322; --psr-dim:#151D31; --psr-ink:#F2F6FF; --psr-muted:#A6B3CF; --psr-line:#1F2A42; --psr-edge:#5B6A8C; --psr-req:#3D7BFF; --psr-read:#22E6FF; --psr-write:#8A5CFF;}#psr-flow-write-path text{font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}#psr-flow-write-path .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}</style><defs><marker id="psr-flow-write-path-req" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--psr-req, #3D7BFF)" stroke="none"/></marker><marker id="psr-flow-write-path-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--psr-muted, #A6B3CF)" stroke="none"/></marker><marker id="psr-flow-write-path-read" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--psr-read, #22E6FF)" stroke="none"/></marker><marker id="psr-flow-write-path-write" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--psr-write, #8A5CFF)" stroke="none"/></marker></defs>
