<text x="34" y="46" font-size="12" font-weight="600" fill="var(--psr-muted, #A6B3CF)" text-anchor="start" letter-spacing="1.6">PIPESMITH REGISTRY 0.2.1</text>
<text x="34" y="86" font-size="30" font-weight="700" fill="var(--psr-ink, #F2F6FF)" text-anchor="start">npm Publish</text>
<text x="34" y="116" font-size="15" font-weight="400" fill="var(--psr-muted, #A6B3CF)" text-anchor="start">npm login trades the password for a token once; every publish sends it as Bearer and writes two blobs.</text>
