<svg xmlns="http://www.w3.org/2000/svg" id="psr-flow-docker" viewBox="0 0 1360 1038" width="1360" height="1038" role="img" aria-label="Docker Push, Pipesmith Registry 0.2.1. docker login gets a token from the token route; the token lives 300 s in memory and every push call carries it. 1: Docker client to Docker port: GET /v2/ without credentials. 2: Docker port to Docker client: 401 WWW-Authenticate: Bearer realm=&quot;.../v2/token&quot;. 3: Docker port: Bearer needs realm DockerToken on and forceBasicAuth false, else Basic. 4: Docker client to Token route: GET /v2/token, Authorization: Basic. 5: Token route to Token memory: limiter, cache and realms as for Basic; token kept. 6: Token route to Docker client: 200 {token, expires_in: 300}; 401, 403, 429. Push. 7: Docker client to Docker port: POST /v2/&lt;image&gt;/blobs/uploads/, Bearer. 8: Docker port to Docker client: 202 Location: .../uploads/&lt;uuid&gt;. 9: Docker client to Docker port: PATCH chunks, then PUT ...?digest=sha256:.... 10: Docker port to local-write: blob v2/-/blobs/&lt;digest&gt;, once per repository. 11: Docker client to Docker port: PUT /v2/&lt;image&gt;/manifests/&lt;tag&gt;. 12: Docker port to local-write: manifest by digest, the tag as a hard link. 13: Docker port to index.sqlite: rows before each answer. 14: Docker port to Docker client: 201 Docker-Content-Digest."><title>Pipesmith Registry docker push</title><style>#psr-flow-docker{--psr-bg:#F5F7FC; --psr-panel:#FFFFFF; --psr-dim:#EEF2FA; --psr-ink:#0A1020; --psr-muted:#46526E; --psr-line:#D8DEEA; --psr-edge:#7A859C; --psr-req:#2B62F0; --psr-read:#12B5D6; --psr-write:#7A52F0;}@media (prefers-color-scheme: dark){#psr-flow-docker{--psr-bg:#05070D; --psr-panel:#0D1322; --psr-dim:#151D31; --psr-ink:#F2F6FF; --psr-muted:#A6B3CF; --psr-line:#1F2A42; --psr-edge:#5B6A8C; --psr-req:#3D7BFF; --psr-read:#22E6FF; --psr-write:#8A5CFF;}}[data-theme="light"] #psr-flow-docker{--psr-bg:#F5F7FC; --psr-panel:#FFFFFF; --psr-dim:#EEF2FA; --psr-ink:#0A1020; --psr-muted:#46526E; --psr-line:#D8DEEA; --psr-edge:#7A859C; --psr-req:#2B62F0; --psr-read:#12B5D6; --psr-write:#7A52F0;}[data-theme="dark"] #psr-flow-docker{--psr-bg:#05070D; --psr-panel:#0D1322; --psr-dim:#151D31; --psr-ink:#F2F6FF; --psr-muted:#A6B3CF; --psr-line:#1F2A42; --psr-edge:#5B6A8C; --psr-req:#3D7BFF; --psr-read:#22E6FF; --psr-write:#8A5CFF;}#psr-flow-docker text{font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}#psr-flow-docker .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}</style><defs><marker id="psr-flow-docker-req" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--psr-req, #3D7BFF)" stroke="none"/></marker><marker id="psr-flow-docker-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--psr-muted, #A6B3CF)" stroke="none"/></marker><marker id="psr-flow-docker-read" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--psr-read, #22E6FF)" stroke="none"/></marker><marker id="psr-flow-docker-write" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--psr-write, #8A5CFF)" stroke="none"/></marker></defs>
