<svg xmlns="http://www.w3.org/2000/svg" id="psr-take-over" viewBox="0 0 1360 725" width="1360" height="725" role="img" aria-label="Take over with Pipesmith Registry 0.2.1. The existing install has two inputs: its blob stores on disk and a copy of its database file. store add reads the blob stores and writes config.json. tools/h2export.sh reads the database copy and writes an export folder, which import reads; import writes state.sqlite and repositories.json. scan reads the blob stores and writes index.sqlite and catalog.sqlite. All five files lie in the data directory. serve reads the data directory and the blob stores. No command writes to the existing install."><title>Pipesmith Registry take over</title><style>#psr-take-over{--psr-bg:#F5F7FC; --psr-panel:#FFFFFF; --psr-dim:#EEF2FA; --psr-ink:#0A1020; --psr-muted:#46526E; --psr-line:#D8DEEA; --psr-edge:#7A859C; --psr-req:#2B62F0; --psr-read:#12B5D6; --psr-write:#7A52F0;}@media (prefers-color-scheme: dark){#psr-take-over{--psr-bg:#05070D; --psr-panel:#0D1322; --psr-dim:#151D31; --psr-ink:#F2F6FF; --psr-muted:#A6B3CF; --psr-line:#1F2A42; --psr-edge:#5B6A8C; --psr-req:#3D7BFF; --psr-read:#22E6FF; --psr-write:#8A5CFF;}}[data-theme="light"] #psr-take-over{--psr-bg:#F5F7FC; --psr-panel:#FFFFFF; --psr-dim:#EEF2FA; --psr-ink:#0A1020; --psr-muted:#46526E; --psr-line:#D8DEEA; --psr-edge:#7A859C; --psr-req:#2B62F0; --psr-read:#12B5D6; --psr-write:#7A52F0;}[data-theme="dark"] #psr-take-over{--psr-bg:#05070D; --psr-panel:#0D1322; --psr-dim:#151D31; --psr-ink:#F2F6FF; --psr-muted:#A6B3CF; --psr-line:#1F2A42; --psr-edge:#5B6A8C; --psr-req:#3D7BFF; --psr-read:#22E6FF; --psr-write:#8A5CFF;}#psr-take-over text{font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}#psr-take-over .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}</style><defs><marker id="psr-take-over-read" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--psr-read, #22E6FF)" stroke="none"/></marker><marker id="psr-take-over-write" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--psr-write, #8A5CFF)" stroke="none"/></marker></defs>
