<text x="1022.4" y="175" font-size="14.5" font-weight="650" fill="var(--psr-ink, #F2F6FF)" text-anchor="middle" class="mono">state.sqlite</text>
<text x="1022.4" y="194" font-size="11.5" font-weight="400" fill="var(--psr-muted, #A6B3CF)" text-anchor="middle">roles, LDAP mappings</text>
<path d="M1236,208 V712" fill="none" stroke="var(--psr-line, #1F2A42)" stroke-width="1.4" stroke-dasharray="3 5"/>
<rect x="1138" y="150" width="196" height="58" rx="10" fill="var(--psr-panel, #0D1322)" stroke="var(--psr-edge, #5B6A8C)" stroke-width="1.6"/>
<text x="1236" y="175" font-size="14.5" font-weight="650" fill="var(--psr-ink, #F2F6FF)" text-anchor="middle">Credential cache</text>
<text x="1236" y="194" font-size="11.5" font-weight="400" fill="var(--psr-muted, #A6B3CF)" text-anchor="middle">300 s</text>
<circle cx="47" cy="275" r="11" fill="var(--psr-panel, #0D1322)" stroke="var(--psr-edge, #5B6A8C)" stroke-width="1"/>
