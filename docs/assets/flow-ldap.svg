<text x="34" y="780" font-size="11.5" font-weight="400" fill="var(--psr-muted, #A6B3CF)" text-anchor="start">Read from internal/ldapauth and internal/auth of Pipesmith Registry 0.2.1, checked 2026-11-19.</text>
