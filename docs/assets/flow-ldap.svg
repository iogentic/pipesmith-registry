<text x="381.6" y="175" font-size="14.5" font-weight="650" fill="var(--psr-ink, #F2F6FF)" text-anchor="middle">Realm LdapRealm</text>
<text x="381.6" y="194" font-size="11.5" font-weight="400" fill="var(--psr-muted, #A6B3CF)" text-anchor="middle">connections in order</text>
