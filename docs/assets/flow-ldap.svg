<rect x="497.2" y="150" width="196" height="58" rx="10" fill="var(--psr-panel, #0D1322)" stroke="var(--psr-edge, #5B6A8C)" stroke-width="1.6"/>
<text x="595.2" y="175" font-size="14.5" font-weight="650" fill="var(--psr-ink, #F2F6FF)" text-anchor="middle">Places</text>
<text x="595.2" y="194" font-size="11.5" font-weight="400" fill="var(--psr-muted, #A6B3CF)" text-anchor="middle">16 at once, 64 waiting</text>
<path d="M808.8,208 V712" fill="none" stroke="var(--psr-line, #1F2A42)" stroke-width="1.4" stroke-dasharray="3 5"/>
<rect x="710.8" y="150" width="196" height="58" rx="10" fill="var(--psr-dim, #151D31)" stroke="var(--psr-edge, #5B6A8C)" stroke-width="1.6"/>
<text x="808.8" y="175" font-size="14.5" font-weight="650" fill="var(--psr-ink, #F2F6FF)" text-anchor="middle">Directory</text>
