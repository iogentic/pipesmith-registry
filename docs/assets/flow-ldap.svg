<text x="702" y="458" font-size="13" font-weight="400" fill="var(--psr-ink, #F2F6FF)" text-anchor="middle">bind as the entry DN with the typed password</text>
<circle cx="47" cy="505" r="11" fill="var(--psr-panel, #0D1322)" stroke="var(--psr-edge, #5B6A8C)" stroke-width="1"/>
<text x="47" y="509" font-size="11" font-weight="650" fill="var(--psr-muted, #A6B3CF)" text-anchor="middle">6</text>
<path d="M595.2,513 H804.8" fill="none" stroke="var(--psr-req, #3D7BFF)" stroke-width="1.8" marker-end="url(#psr-flow-ldap-req)"/>
<text x="702" y="504" font-size="13" font-weight="400" fill="var(--psr-ink, #F2F6FF)" text-anchor="middle">groups: memberOf, or a search by member</text>
<circle cx="47" cy="551" r="11" fill="var(--psr-panel, #0D1322)" stroke="var(--psr-edge, #5B6A8C)" stroke-width="1"/>
<text x="47" y="555" font-size="11" font-weight="650" fill="var(--psr-muted, #A6B3CF)" text-anchor="middle">7</text>
<path d="M808.8,559 H385.6" fill="none" stroke="var(--psr-muted, #A6B3CF)" stroke-width="1.8" marker-end="url(#psr-flow-ldap-muted)" stroke-dasharray="2 4"/>
<text x="595.2" y="550" font-size="13" font-weight="400" fill="var(--psr-muted, #A6B3CF)" text-anchor="middle">user and group names; a wrong pair asks the next connection</text>
<circle cx="47" cy="597" r="11" fill="var(--psr-panel, #0D1322)" stroke="var(--psr-edge, #5B6A8C)" stroke-width="1"/>
<text x="47" y="601" font-size="11" font-weight="650" fill="var(--psr-muted, #A6B3CF)" text-anchor="middle">8</text>
