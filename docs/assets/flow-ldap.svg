<text x="702" y="412" font-size="13" font-weight="400" fill="var(--psr-ink, #F2F6FF)" text-anchor="middle">search the user below the base, at most 2 hits</text>
<circle cx="47" cy="459" r="11" fill="var(--psr-panel, #0D1322)" stroke="var(--psr-edge, #5B6A8C)" stroke-width="1"/>
