<svg xmlns="http://www.w3.org/2000/svg" id="psr-flow-way-back" viewBox="0 0 1360 854" width="1360" height="854" role="img" aria-label="Way Back, Pipesmith Registry 0.2.0. The first command of this version copies state.sqlite before it migrates; the way back is that copy and the earlier binary. 1: Operator to This version: serve or state show. 2: This version to state.sqlite.v1: VACUUM INTO, mode 0600, never replaced. 3: This version to state.sqlite: step 2: table tokens, generation row. 4: Operator to Earlier binary: start on the migrated file. 5: Earlier binary to Operator: refused: state.sqlite has schema 2, this binary knows schema 1. Way back by hand. 6: Operator to This version: stop the server. 7: Operator to state.sqlite: move state.sqlite, -wal and -shm away. 8: Operator to state.sqlite.v1: rename state.sqlite.v1 to state.sqlite. 9: Operator to Earlier binary: start the earlier binary. 10: Operator: changes of users, roles, realms and tokens since the upgrade are lost."><title>Pipesmith Registry way back</title><style>#psr-flow-way-back{--psr-bg:#F5F7FC; --psr-panel:#FFFFFF; --psr-dim:#EEF2FA; --psr-ink:#0A1020; --psr-muted:#46526E; --psr-line:#D8DEEA; --psr-edge:#7A859C; --psr-req:#2B62F0; --psr-read:#12B5D6; --psr-write:#7A52F0;}@media (prefers-color-scheme: dark){#psr-flow-way-back{--psr-bg:#05070D; --psr-panel:#0D1322; --psr-dim:#151D31; --psr-ink:#F2F6FF; --psr-muted:#A6B3CF; --psr-line:#1F2A42; --psr-edge:#5B6A8C; --psr-req:#3D7BFF; --psr-read:#22E6FF; --psr-write:#8A5CFF;}}[data-theme="light"] #psr-flow-way-back{--psr-bg:#F5F7FC; --psr-panel:#FFFFFF; --psr-dim:#EEF2FA; --psr-ink:#0A1020; --psr-muted:#46526E; --psr-line:#D8DEEA; --psr-edge:#7A859C; --psr-req:#2B62F0; --psr-read:#12B5D6; --psr-write:#7A52F0;}[data-theme="dark"] #psr-flow-way-back{--psr-bg:#05070D; --psr-panel:#0D1322; --psr-dim:#151D31; --psr-ink:#F2F6FF; --psr-muted:#A6B3CF; --psr-line:#1F2A42; --psr-edge:#5B6A8C; --psr-req:#3D7BFF; --psr-read:#22E6FF; --psr-write:#8A5CFF;}#psr-flow-way-back text{font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}#psr-flow-way-back .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}</style><defs><marker id="psr-flow-way-back-req" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--psr-req, #3D7BFF)" stroke="none"/></marker><marker id="psr-flow-way-back-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--psr-muted, #A6B3CF)" stroke="none"/></marker><marker id="psr-flow-way-back-read" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--psr-read, #22E6FF)" stroke="none"/></marker><marker id="psr-flow-way-back-write" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--psr-write, #8A5CFF)" stroke="none"/></marker></defs>
