<svg xmlns="http://www.w3.org/2000/svg" id="psr-flow-proxy" viewBox="0 0 1360 854" width="1360" height="854" role="img" aria-label="Proxy Fetch, Pipesmith Registry 0.2.0. A proxy answers from its cache while the copy is fresh, and stores and checks a fetched file before the client gets a byte. 1: Client to Proxy repository: GET /repository/&lt;proxy&gt;/&lt;path&gt;. 2: Proxy repository: routing rule first: a blocked path answers 403. 3: Proxy repository to Cache: index row of the path. 4: Proxy repository to catalog.sqlite: last check, ETag, Last-Modified, not found mark. 5: Proxy repository: fresh: the cached copy answers, nothing goes out. Stale or missing. 6: Proxy repository to Remote: GET with If-None-Match and If-Modified-Since. 7: Remote to Proxy repository: 200, 304, 404, or a failure. 8: Proxy repository to Cache: 200: stored, checked against .sha1, integrity or digest. 9: Proxy repository to catalog.sqlite: checked now, new validators; a 404 is remembered. 10: Proxy repository to Client: the stored copy; remote failed: cached copy, else 502."><title>Pipesmith Registry proxy fetch</title><style>#psr-flow-proxy{--psr-bg:#F5F7FC; --psr-panel:#FFFFFF; --psr-dim:#EEF2FA; --psr-ink:#0A1020; --psr-muted:#46526E; --psr-line:#D8DEEA; --psr-edge:#7A859C; --psr-req:#2B62F0; --psr-read:#12B5D6; --psr-write:#7A52F0;}@media (prefers-color-scheme: dark){#psr-flow-proxy{--psr-bg:#05070D; --psr-panel:#0D1322; --psr-dim:#151D31; --psr-ink:#F2F6FF; --psr-muted:#A6B3CF; --psr-line:#1F2A42; --psr-edge:#5B6A8C; --psr-req:#3D7BFF; --psr-read:#22E6FF; --psr-write:#8A5CFF;}}[data-theme="light"] #psr-flow-proxy{--psr-bg:#F5F7FC; --psr-panel:#FFFFFF; --psr-dim:#EEF2FA; --psr-ink:#0A1020; --psr-muted:#46526E; --psr-line:#D8DEEA; --psr-edge:#7A859C; --psr-req:#2B62F0; --psr-read:#12B5D6; --psr-write:#7A52F0;}[data-theme="dark"] #psr-flow-proxy{--psr-bg:#05070D; --psr-panel:#0D1322; --psr-dim:#151D31; --psr-ink:#F2F6FF; --psr-muted:#A6B3CF; --psr-line:#1F2A42; --psr-edge:#5B6A8C; --psr-req:#3D7BFF; --psr-read:#22E6FF; --psr-write:#8A5CFF;}#psr-flow-proxy text{font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}#psr-flow-proxy .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}</style><defs><marker id="psr-flow-proxy-req" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--psr-req, #3D7BFF)" stroke="none"/></marker><marker id="psr-flow-proxy-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--psr-muted, #A6B3CF)" stroke="none"/></marker><marker id="psr-flow-proxy-read" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--psr-read, #22E6FF)" stroke="none"/></marker><marker id="psr-flow-proxy-write" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--psr-write, #8A5CFF)" stroke="none"/></marker></defs>
<rect x="0" y="0" width="1360" height="854" rx="18" fill="var(--psr-bg, #05070D)" stroke="var(--psr-line, #1F2A42)" stroke-width="1"/>
<text x="34" y="46" font-size="12" font-weight="600" fill="var(--psr-muted, #A6B3CF)" text-anchor="start" letter-spacing="1.6">PIPESMITH REGISTRY 0.2.0</text>
<text x="34" y="86" font-size="30" font-weight="700" fill="var(--psr-ink, #F2F6FF)" text-anchor="start">Proxy Fetch</text>
<text x="34" y="116" font-size="15" font-weight="400" fill="var(--psr-muted, #A6B3CF)" text-anchor="start">A proxy answers from its cache while the copy is fresh, and stores and checks a fetched file before the client gets a byte.</text>
