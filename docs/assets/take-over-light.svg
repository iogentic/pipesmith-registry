<svg xmlns="http://www.w3.org/2000/svg" id="psr-take-over" viewBox="0 0 1360 725" width="1360" height="725" role="img" aria-label="Take over with Pipesmith Registry 0.1.3. The existing install has two inputs: its blob stores on disk and a copy of its database file. store add reads the blob stores and writes config.json. tools/h2export.sh reads the database copy and writes an export folder, which import reads; import writes state.sqlite and repositories.json. scan reads the blob stores and writes index.sqlite and catalog.sqlite. All five files lie in the data directory. serve reads the data directory and the blob stores. No command writes to the existing install."><title>Pipesmith Registry take over</title><defs><marker id="psr-take-over-read" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#12B5D6" stroke="none"/></marker><marker id="psr-take-over-write" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7A52F0" stroke="none"/></marker></defs>
