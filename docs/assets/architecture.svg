<svg xmlns="http://www.w3.org/2000/svg" id="psr-architecture" viewBox="0 0 1360 740" width="1360" height="740" role="img" aria-label="Architecture of Pipesmith Registry 0.1.0. Maven, npm and Docker clients and a browser send requests to one static binary. Inside it a request passes the listeners, one main port plus one port per Docker repository, then a Host gate that answers 403 unless the Host header names the server, then sign in and permissions. It then reaches the embedded interface, the read only REST API or the read path for Maven, npm, Docker and plain files. The read path and the REST API look files up in an SQLite index. The listeners take their ports from config.json, sign in reads users, roles and privileges from state.sqlite. On disk the binary reads the file blob stores of an existing install in place and never writes them. Its own data directory holds config.json, repositories.json, state.sqlite with users, roles, privileges and LDAP connections, and index.sqlite, which scan fills from the blob stores."><title>Pipesmith Registry architecture</title><style>#psr-architecture{--psr-bg:#F5F7FC; --psr-panel:#FFFFFF; --psr-dim:#EEF2FA; --psr-ink:#0A1020; --psr-muted:#46526E; --psr-line:#D8DEEA; --psr-edge:#7A859C; --psr-req:#2B62F0; --psr-read:#12B5D6; --psr-write:#7A52F0;}@media (prefers-color-scheme: dark){#psr-architecture{--psr-bg:#05070D; --psr-panel:#0D1322; --psr-dim:#151D31; --psr-ink:#F2F6FF; --psr-muted:#A6B3CF; --psr-line:#1F2A42; --psr-edge:#5B6A8C; --psr-req:#3D7BFF; --psr-read:#22E6FF; --psr-write:#8A5CFF;}}[data-theme="light"] #psr-architecture{--psr-bg:#F5F7FC; --psr-panel:#FFFFFF; --psr-dim:#EEF2FA; --psr-ink:#0A1020; --psr-muted:#46526E; --psr-line:#D8DEEA; --psr-edge:#7A859C; --psr-req:#2B62F0; --psr-read:#12B5D6; --psr-write:#7A52F0;}[data-theme="dark"] #psr-architecture{--psr-bg:#05070D; --psr-panel:#0D1322; --psr-dim:#151D31; --psr-ink:#F2F6FF; --psr-muted:#A6B3CF; --psr-line:#1F2A42; --psr-edge:#5B6A8C; --psr-req:#3D7BFF; --psr-read:#22E6FF; --psr-write:#8A5CFF;}#psr-architecture text{font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}#psr-architecture .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}</style><defs><marker id="psr-architecture-req" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--psr-req, #3D7BFF)" stroke="none"/></marker><marker id="psr-architecture-read" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--psr-read, #22E6FF)" stroke="none"/></marker><marker id="psr-architecture-write" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--psr-write, #8A5CFF)" stroke="none"/></marker></defs>
<rect x="0" y="0" width="1360" height="740" rx="18" fill="var(--psr-bg, #05070D)" stroke="var(--psr-line, #1F2A42)" stroke-width="1"/>
<text x="34" y="46" font-size="12" font-weight="600" fill="var(--psr-muted, #A6B3CF)" text-anchor="start" letter-spacing="1.6">PIPESMITH REGISTRY 0.1.0</text>
<text x="34" y="86" font-size="30" font-weight="700" fill="var(--psr-ink, #F2F6FF)" text-anchor="start">Architecture</text>
<text x="34" y="116" font-size="15" font-weight="400" fill="var(--psr-muted, #A6B3CF)" text-anchor="start">One static binary serves the file blob stores of an existing install in place. It writes only to its own data directory.</text>
<text x="34" y="156" font-size="11" font-weight="600" fill="var(--psr-muted, #A6B3CF)" text-anchor="start" letter-spacing="1.6">CLIENTS</text>
<text x="330" y="156" font-size="11" font-weight="600" fill="var(--psr-muted, #A6B3CF)" text-anchor="start" letter-spacing="1.6">ONE BINARY</text>
<text x="986" y="156" font-size="11" font-weight="600" fill="var(--psr-muted, #A6B3CF)" text-anchor="start" letter-spacing="1.6">ON DISK</text>
<rect x="34" y="176" width="240" height="92" rx="10" fill="var(--psr-panel, #0D1322)" stroke="var(--psr-edge, #5B6A8C)" stroke-width="1"/>
<text x="50" y="202" font-size="16" font-weight="650" fill="var(--psr-ink, #F2F6FF)" text-anchor="start">Maven</text>
<text x="50" y="222" font-size="13" font-weight="400" fill="var(--psr-muted, #A6B3CF)" text-anchor="start">Maven and Gradle builds</text>
<text x="50" y="240" font-size="12" font-weight="400" fill="var(--psr-muted, #A6B3CF)" text-anchor="start" class="mono">/repository/&lt;name&gt;/...</text>
<text x="50" y="257" font-size="12" font-weight="400" fill="var(--psr-muted, #A6B3CF)" text-anchor="start">Basic credentials</text>
<rect x="34" y="282" width="240" height="92" rx="10" fill="var(--psr-panel, #0D1322)" stroke="var(--psr-edge, #5B6A8C)" stroke-width="1"/>
<text x="50" y="308" font-size="16" font-weight="650" fill="var(--psr-ink, #F2F6FF)" text-anchor="start">npm</text>
<text x="50" y="328" font-size="13" font-weight="400" fill="var(--psr-muted, #A6B3CF)" text-anchor="start">package documents, tarballs</text>
<text x="50" y="346" font-size="12" font-weight="400" fill="var(--psr-muted, #A6B3CF)" text-anchor="start" class="mono">/repository/&lt;name&gt;/...</text>
<text x="50" y="363" font-size="12" font-weight="400" fill="var(--psr-muted, #A6B3CF)" text-anchor="start">Basic credentials</text>
<rect x="34" y="388" width="240" height="92" rx="10" fill="var(--psr-panel, #0D1322)" stroke="var(--psr-edge, #5B6A8C)" stroke-width="1"/>
<text x="50" y="414" font-size="16" font-weight="650" fill="var(--psr-ink, #F2F6FF)" text-anchor="start">Docker</text>
<text x="50" y="434" font-size="13" font-weight="400" fill="var(--psr-muted, #A6B3CF)" text-anchor="start">one port per repository</text>
<text x="50" y="452" font-size="12" font-weight="400" fill="var(--psr-muted, #A6B3CF)" text-anchor="start" class="mono">/v2/... on that port</text>
<text x="50" y="469" font-size="12" font-weight="400" fill="var(--psr-muted, #A6B3CF)" text-anchor="start">Basic credentials</text>
<rect x="34" y="494" width="240" height="92" rx="10" fill="var(--psr-panel, #0D1322)" stroke="var(--psr-edge, #5B6A8C)" stroke-width="1"/>
<text x="50" y="520" font-size="16" font-weight="650" fill="var(--psr-ink, #F2F6FF)" text-anchor="start">Browser</text>
<text x="50" y="540" font-size="13" font-weight="400" fill="var(--psr-muted, #A6B3CF)" text-anchor="start">administration interface</text>
<text x="50" y="558" font-size="12" font-weight="400" fill="var(--psr-muted, #A6B3CF)" text-anchor="start" class="mono">/ and /service/rest/v1</text>
<text x="50" y="575" font-size="12" font-weight="400" fill="var(--psr-muted, #A6B3CF)" text-anchor="start">session cookie</text>
<rect x="330" y="176" width="600" height="456" rx="14" fill="var(--psr-dim, #151D31)" stroke="var(--psr-edge, #5B6A8C)" stroke-width="1.4"/>
<text x="350" y="204" font-size="14" font-weight="650" fill="var(--psr-ink, #F2F6FF)" text-anchor="start" class="mono">pipesmith-registry serve</text>
<text x="910" y="204" font-size="12" font-weight="400" fill="var(--psr-muted, #A6B3CF)" text-anchor="end">static, no runtime dependencies</text>
<rect x="350" y="220" width="560" height="58" rx="10" fill="var(--psr-panel, #0D1322)" stroke="var(--psr-edge, #5B6A8C)" stroke-width="1"/>
<text x="366" y="245" font-size="15" font-weight="650" fill="var(--psr-ink, #F2F6FF)" text-anchor="start">Listeners</text>
<text x="366" y="265" font-size="13" font-weight="400" fill="var(--psr-muted, #A6B3CF)" text-anchor="start">the main port and one port per Docker repository, from config.json</text>
<rect x="350" y="294" width="560" height="58" rx="10" fill="var(--psr-panel, #0D1322)" stroke="var(--psr-edge, #5B6A8C)" stroke-width="1"/>
