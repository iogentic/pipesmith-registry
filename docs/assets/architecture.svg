<rect x="350" y="442" width="176" height="86" rx="10" fill="var(--psr-panel, #0D1322)" stroke="var(--psr-edge, #5B6A8C)" stroke-width="1"/>
<text x="364" y="467" font-size="15" font-weight="650" fill="var(--psr-ink, #F2F6FF)" text-anchor="start">Interface</text>
<text x="364" y="489" font-size="12.5" font-weight="400" fill="var(--psr-muted, #A6B3CF)" text-anchor="start">embedded, at /</text>
<text x="364" y="508" font-size="12.5" font-weight="400" fill="var(--psr-muted, #A6B3CF)" text-anchor="start">all screens read only</text>
<path d="M438,426 V440" fill="none" stroke="var(--psr-req, #3D7BFF)" stroke-width="1.8" marker-end="url(#psr-architecture-req)"/>
<rect x="542" y="442" width="176" height="86" rx="10" fill="var(--psr-panel, #0D1322)" stroke="var(--psr-edge, #5B6A8C)" stroke-width="1"/>
